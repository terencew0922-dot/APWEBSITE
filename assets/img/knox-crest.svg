<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-label="Knox Grammar School crest: blue saltire with Scottish thistle and the motto Virile Agitur">
  <defs>
    <linearGradient id="kxBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#1748b0"/>
    </linearGradient>
  </defs>

  <!-- ===== Saltire (St Andrew's cross) ===== -->
  <g>
    <!-- back-diagonal "\" -->
    <rect x="38" y="172" width="244" height="52" rx="7"
          transform="rotate(45 160 210)" fill="url(#kxBlue)" stroke="#fff" stroke-width="6"/>
    <!-- fore-diagonal "/" -->
    <rect x="38" y="172" width="244" height="52" rx="7"
          transform="rotate(-45 160 210)" fill="url(#kxBlue)" stroke="#fff" stroke-width="6"/>
    <!-- inner white hairlines to echo the segmented arms -->
    <g stroke="#dbe7ff" stroke-width="2.4" opacity=".55">
      <line x1="70" y1="120" x2="250" y2="300" transform="rotate(0 160 210)"/>
    </g>
  </g>

  <!-- white roundel so the thistle reads cleanly over the cross -->
  <circle cx="160" cy="212" r="58" fill="#f7f9ff"/>
  <circle cx="160" cy="212" r="58" fill="none" stroke="#13316f" stroke-width="2"/>

  <!-- ===== Scottish thistle ===== -->
  <g stroke="#12275a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#12275a">
    <!-- bloom spikes -->
    <g fill="#5b86d6" stroke="#12275a" stroke-width="2.4">
      <path d="M160 156 L150 184 L170 184 Z"/>
      <path d="M138 162 L139 188 L158 180 Z"/>
      <path d="M182 162 L181 188 L162 180 Z"/>
      <path d="M122 176 L132 196 L150 184 Z"/>
      <path d="M198 176 L188 196 L170 184 Z"/>
    </g>
    <!-- crown notches on bloom -->
    <path d="M141 184 q19 -12 38 0" fill="none" stroke="#12275a" stroke-width="2.6"/>

    <!-- calyx / bulb -->
    <path d="M160 182
             C 142 188 134 202 138 216
             C 142 232 160 244 160 244
             C 160 244 178 232 182 216
             C 186 202 178 188 160 182 Z"
          fill="#9db8ee" stroke="#12275a" stroke-width="3"/>
    <!-- cross-hatch on the bulb -->
    <g stroke="#12275a" stroke-width="2" fill="none" opacity=".9">
      <path d="M145 196 L172 224"/>
      <path d="M157 190 L181 216"/>
      <path d="M139 208 L162 232"/>
      <path d="M175 196 L148 224"/>
      <path d="M163 190 L139 216"/>
      <path d="M181 208 L158 232"/>
    </g>

    <!-- stem -->
    <path d="M160 244 L160 270" fill="none" stroke="#12275a" stroke-width="4"/>
    <!-- leaves -->
    <path d="M160 262 C 142 258 128 266 120 280 C 138 280 152 274 160 266 Z"
          fill="#7da0e6" stroke="#12275a" stroke-width="2.6"/>
    <path d="M160 262 C 178 258 192 266 200 280 C 182 280 168 274 160 266 Z"
          fill="#7da0e6" stroke="#12275a" stroke-width="2.6"/>
  </g>

  <!-- ===== Motto banner ===== -->
  <g>
    <!-- tails -->
    <path d="M14 40 L46 30 L42 58 L18 64 Z" fill="#0a0d14"/>
    <path d="M306 40 L274 30 L278 58 L302 64 Z" fill="#0a0d14"/>
    <!-- main ribbon -->
    <path d="M40 26 Q160 8 280 26 L280 56 Q160 40 40 56 Z" fill="#0a0d14"/>
    <path d="M40 26 Q160 8 280 26 L280 56 Q160 40 40 56 Z" fill="none" stroke="#2f6fe0" stroke-width="1.5" opacity=".5"/>
    <text x="160" y="44" text-anchor="middle" fill="#ffffff"
          font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700"
          letter-spacing="3">VIRILE AGITUR</text>
  </g>
</svg>
