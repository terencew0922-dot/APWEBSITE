<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources · Knox Grammar School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/img/knox-logo.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="bg-aura"></div>
  <div class="bg-grid"></div>
  <div id="nav-mount" data-active="resources.html"></div>

  <header class="page-hero">
    <div class="container">
      <span class="eyebrow reveal in"><span class="dot"></span> Library</span>
      <h1 class="reveal in">Resource <span class="grad">Library</span></h1>
      <p class="reveal in">Notes, past papers and revision guides, organised by year level and subject.</p>
    </div>
  </header>

  <section class="section" style="padding-top:30px">
    <div class="container">
      <div class="picker reveal">
        <div class="pick-step">
          <div class="pick-label"><b>1</b> Choose a year level</div>
          <div class="pick-options" id="year-options">
            <button class="pick-btn" data-year="7">Year 7</button>
            <button class="pick-btn" data-year="8">Year 8</button>
            <button class="pick-btn" data-year="9">Year 9</button>
            <button class="pick-btn" data-year="10">Year 10</button>
            <button class="pick-btn" data-year="11">Year 11</button>
            <button class="pick-btn" data-year="12">Year 12</button>
          </div>
        </div>
        <div class="pick-step" id="subject-step" hidden>
          <div class="pick-label"><b>2</b> Choose a subject
            <button class="pick-reset" id="reset-year" type="button">⟲ Change year</button>
          </div>
          <div class="pick-options" id="subject-options"><!-- injected --></div>
        </div>
      </div>

      <div class="res-meta" id="res-meta"></div>
      <div class="res-grid" id="res-grid"><!-- injected --></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta-band reveal">
        <h2>Contribute to the library</h2>
        <p>Staff and students can submit notes, guides and past papers for the wider School to use.</p>
        <div class="hero-actions"><a href="about.html#contact" class="btn btn-primary">Submit a resource</a></div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const resources = [
      { subj:'Mathematics', year:11, type:'Past Papers', icon:'📐', title:'Algebra II — Full Exam Pack', desc:'Ten years of past papers with fully worked mark schemes and examiner tips.', tags:['PDF'] },
      { subj:'Mathematics', year:12, type:'Video Series', icon:'🎬', title:'Calculus Crash Course', desc:'Limits, derivatives and integration explained from scratch in 12 short lessons.', tags:['Video'] },
      { subj:'Science', year:9, type:'Revision Guide', icon:'🧪', title:'Chemistry: Bonding &amp; Reactions', desc:'Visual revision guide covering ionic, covalent and metallic bonding with diagrams.', tags:['PDF'] },
      { subj:'Science', year:7, type:'Interactive', icon:'🔬', title:'Virtual Biology Lab', desc:'Run dissections and cell experiments safely in an interactive 3D simulation.', tags:['Web'] },
      { subj:'Science', year:12, type:'Notes', icon:'⚛️', title:'Physics Formula Sheet', desc:'Every formula you need for mechanics, waves and electricity on two clean pages.', tags:['PDF'] },
      { subj:'English', year:8, type:'Study Guide', icon:'📖', title:'Essay Writing Masterclass', desc:'Structure, thesis statements and analysis techniques for top-band essays.', tags:['PDF'] },
      { subj:'English', year:12, type:'Reading List', icon:'📚', title:'Senior English Reading List', desc:'Curated novels and poems with discussion questions to prepare for next term.', tags:['Doc'] },
      { subj:'Humanities', year:11, type:'Past Papers', icon:'🏛️', title:'History Source Analysis Pack', desc:'Source-based questions with model answers and the SOURCE technique breakdown.', tags:['PDF'] },
      { subj:'Humanities', year:7, type:'Atlas', icon:'🗺️', title:'Interactive Geography Atlas', desc:'Climate, population and tectonics maps you can layer and explore.', tags:['Web'] },
      { subj:'Languages', year:8, type:'Flashcards', icon:'🇫🇷', title:'French Vocabulary Decks', desc:'1,000 high-frequency words sorted by theme with audio pronunciation.', tags:['App'] },
      { subj:'Languages', year:9, type:'Audio', icon:'🎧', title:'Spanish Listening Practice', desc:'Graded listening clips with transcripts to sharpen your comprehension.', tags:['Audio'] },
      { subj:'Arts', year:12, type:'Tutorial', icon:'🎨', title:'Portfolio Building Workshop', desc:'How to document process work and present a standout art portfolio.', tags:['Video'] },
      { subj:'Arts', year:7, type:'Templates', icon:'🎼', title:'Music Theory Worksheets', desc:'Scales, intervals and chord progressions with printable practice sheets.', tags:['PDF'] },
      { subj:'Mathematics', year:12, type:'Toolkit', icon:'🧮', title:'Statistics Cheat Sheet', desc:'Probability rules, distributions and hypothesis testing at a glance.', tags:['PDF'] },
      { subj:'Science', year:10, type:'Video Series', icon:'🌍', title:'Earth &amp; Climate Science', desc:'Documentary-style lessons connecting curriculum topics to real-world events.', tags:['Video'] }
    ];

    const typeColor = { 'Past Papers':'#2f6bff','Video Series':'#6a5cff','Revision Guide':'#38e1ff','Interactive':'#34e0a1','Notes':'#ffcf5c','Study Guide':'#2f6bff','Reading List':'#6a5cff','Atlas':'#38e1ff','Flashcards':'#34e0a1','Audio':'#ffcf5c','Tutorial':'#6a5cff','Templates':'#2f6bff','Toolkit':'#38e1ff' };

    const typeColorOf = t => typeColor[t] || '#7db1ff';
    const SUBJECTS = ['Mathematics','Science','English','Humanities','Languages','Arts'];
    let selYear = null, selSubject = 'all';

    function cardHTML(r){
      return `
        <article class="res-card reveal in">
          <div class="res-top">
            <div class="r-icon">${r.subj[0]}</div>
            <span class="res-type" style="color:${typeColorOf(r.type)}">${r.type}</span>
          </div>
          <div class="res-body">
            <h3>${r.title}</h3>
            <p>${r.desc}</p>
            <div class="res-foot">
              <div class="res-tags"><span class="tag" style="color:var(--gold-soft);border-color:var(--border-strong)">Year ${r.year}</span>${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
              <button class="btn btn-ghost btn-sm" data-open="${r.title}">Open ↗</button>
            </div>
          </div>
        </article>`;
    }

    function subjectsForYear(y){
      const set = new Set(resources.filter(r=>r.year===y).map(r=>r.subj));
      return SUBJECTS.filter(s=>set.has(s));
    }

    function renderSubjects(){
      const wrap = document.getElementById('subject-options');
      const subs = subjectsForYear(selYear);
      wrap.innerHTML = `<button class="pick-btn active" data-subj="all">All subjects</button>` +
        subs.map(s=>`<button class="pick-btn" data-subj="${s}">${s}</button>`).join('');
      wrap.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{
        wrap.querySelectorAll('[data-subj]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); selSubject=b.dataset.subj; renderResults();
      });
    }

    function renderResults(){
      const grid = document.getElementById('res-grid');
      const meta = document.getElementById('res-meta');
      if(selYear===null){
        meta.textContent = '';
        grid.innerHTML = '<div class="card empty-state" style="grid-column:1/-1"><h3>Pick a year level to begin</h3><p>Choose a year above, then narrow by subject.</p></div>';
        return;
      }
      const list = resources
        .filter(r=> r.year===selYear && (selSubject==='all' || r.subj===selSubject))
        .sort((a,b)=> a.subj.localeCompare(b.subj) || a.title.localeCompare(b.title));
      meta.innerHTML = `<span>Year ${selYear}${selSubject==='all'?'':' · '+selSubject}</span><span>${list.length} resource${list.length===1?'':'s'}</span>`;
      grid.innerHTML = list.length
        ? list.map(cardHTML).join('')
        : '<div class="card empty-state" style="grid-column:1/-1"><h3>Nothing here yet</h3><p>No resources for this selection.</p></div>';
      grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showToast('Opening “'+b.dataset.open+'”'));
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      renderResults();
      document.querySelectorAll('#year-options [data-year]').forEach(b=>b.onclick=()=>{
        document.querySelectorAll('#year-options [data-year]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        selYear = parseInt(b.dataset.year,10); selSubject = 'all';
        document.getElementById('subject-step').hidden = false;
        renderSubjects(); renderResults();
      });
      document.getElementById('reset-year').onclick=()=>{
        selYear = null; selSubject = 'all';
        document.querySelectorAll('#year-options [data-year]').forEach(x=>x.classList.remove('active'));
        document.getElementById('subject-step').hidden = true;
        renderResults();
      };

      // If arriving from the home page with ?year=N, jump straight to subject selection
      const qy = new URLSearchParams(location.search).get('year');
      if (qy && /^(7|8|9|10|11|12)$/.test(qy)) {
        const btn = document.querySelector('#year-options [data-year="'+qy+'"]');
        if (btn) {
          btn.click();
          document.querySelector('.picker').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  </script>
</body>
</html>
