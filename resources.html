<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources · Knox Grammar School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/img/knox-logo.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="bg-aura"></div>
  <div class="bg-grid"></div>
  <div id="nav-mount" data-active="resources.html"></div>

  <header class="page-hero">
    <div class="container">
      <span class="eyebrow reveal in"><span class="dot"></span> Library</span>
      <h1 class="reveal in">Resource <span class="grad">Library</span></h1>
      <p class="reveal in">Notes, past papers and revision guides, organised by year level and subject.</p>
    </div>
  </header>

  <section class="section" style="padding-top:30px">
    <div class="container">
      <div class="picker reveal">
        <div class="pick-row">
          <span class="pick-cap">Year</span>
          <div class="tabs" id="year-tabs">
            <button class="tab" data-year="7">Year 7</button>
            <button class="tab" data-year="8">Year 8</button>
            <button class="tab" data-year="9">Year 9</button>
            <button class="tab" data-year="10">Year 10</button>
            <button class="tab" data-year="11">Year 11</button>
            <button class="tab" data-year="12">Year 12</button>
          </div>
        </div>
        <div class="pick-row">
          <span class="pick-cap">Subject</span>
          <div class="tabs" id="subject-tabs"><!-- injected --></div>
        </div>
      </div>

      <div class="res-meta" id="res-meta"></div>
      <div class="res-grid" id="res-grid"><!-- injected --></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta-band reveal">
        <h2>Contribute to the library</h2>
        <p>Staff and students can submit notes, guides and past papers for the wider School to use.</p>
        <div class="hero-actions"><a href="about.html#contact" class="btn btn-primary">Submit a resource</a></div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/resources-data.js"></script>
  <script>
    const resources = window.KNOX_RESOURCES;

    const typeColor = { 'Past Papers':'#2f6bff','Video Series':'#6a5cff','Revision Guide':'#38e1ff','Interactive':'#34e0a1','Notes':'#ffcf5c','Study Guide':'#2f6bff','Reading List':'#6a5cff','Atlas':'#38e1ff','Flashcards':'#34e0a1','Audio':'#ffcf5c','Tutorial':'#6a5cff','Templates':'#2f6bff','Toolkit':'#38e1ff' };

    const typeColorOf = t => typeColor[t] || '#7db1ff';

    function cardHTML(r){
      return `
        <article class="res-card reveal in">
          <div class="res-top">
            <div class="r-icon">${r.subj[0]}</div>
            <span class="res-type" style="color:${typeColorOf(r.type)}">${r.type}</span>
          </div>
          <div class="res-body">
            <h3>${r.title}</h3>
            <p>${r.desc}</p>
            <div class="res-foot">
              <div class="res-tags"><span class="tag" style="color:var(--gold-soft);border-color:var(--border-strong)">Year ${r.year}</span>${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
              <button class="btn btn-ghost btn-sm" data-open="${r.title}">Open ↗</button>
            </div>
          </div>
        </article>`;
    }

    const subjectsForYear = y => (window.KNOX_SUBJECTS_BY_YEAR && window.KNOX_SUBJECTS_BY_YEAR[y]) || [];
    const levelsForYear   = y => (window.KNOX_MATHS_LEVELS && window.KNOX_MATHS_LEVELS[y]) || [];

    let selYear = 7, selVal = 'all', currentItems = [];

    // Build the subject tab list for a year, with Mathematics expanded into its
    // streams (Core/da Vinci or Standard/Advanced/Extension) inline with the
    // other subjects.
    function subjectItems(y){
      const items = [{ val:'all', label:'All subjects', subj:'all' }];
      subjectsForYear(y).forEach(s => {
        const levels = levelsForYear(y);
        if (s === 'Mathematics' && levels.length){
          levels.forEach(l => items.push({
            val: 'Mathematics|' + l,
            label: l.indexOf('Mathematics') === 0 ? l : 'Mathematics ' + l,
            subj: 'Mathematics', level: l
          }));
        } else {
          items.push({ val:s, label:s, subj:s });
        }
      });
      return items;
    }

    function renderSubjectTabs(){
      const wrap = document.getElementById('subject-tabs');
      currentItems = subjectItems(selYear);
      wrap.innerHTML = currentItems.map(it => `<button class="tab${it.val===selVal?' active':''}" data-val="${it.val}">${it.label}</button>`).join('');
      wrap.querySelectorAll('[data-val]').forEach(btn=>btn.onclick=()=>{
        selVal = btn.dataset.val;
        wrap.querySelectorAll('[data-val]').forEach(x=>x.classList.toggle('active', x===btn));
        renderResults();
      });
    }

    function renderResults(){
      const grid = document.getElementById('res-grid');
      const meta = document.getElementById('res-meta');
      const item = currentItems.find(i=>i.val===selVal) || currentItems[0];
      const list = resources.filter(r =>
        r.year===selYear &&
        (item.subj==='all' || (r.subj===item.subj && (!item.level || r.level===item.level)))
      ).sort((a,b)=> a.subj.localeCompare(b.subj) || (a.level||'').localeCompare(b.level||'') || a.title.localeCompare(b.title));

      const crumbs = ['Year '+selYear];
      if (item.val!=='all') crumbs.push(item.label);
      meta.innerHTML = `<span>${crumbs.join(' · ')}</span><span>${list.length} resource${list.length===1?'':'s'}</span>`;
      grid.innerHTML = list.length
        ? list.map(cardHTML).join('')
        : '<div class="card empty-state" style="grid-column:1/-1"><h3>Nothing here yet</h3><p>No resources for this selection.</p></div>';
      grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showToast('Opening “'+b.dataset.open+'”'));
    }

    function selectYear(y){
      selYear = y; selVal = 'all';
      document.querySelectorAll('#year-tabs [data-year]').forEach(x=>x.classList.toggle('active', parseInt(x.dataset.year,10)===y));
      renderSubjectTabs(); renderResults();
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelectorAll('#year-tabs [data-year]').forEach(b=>b.onclick=()=> selectYear(parseInt(b.dataset.year,10)));
      const qy = new URLSearchParams(location.search).get('year');
      selectYear(qy && /^(7|8|9|10|11|12)$/.test(qy) ? parseInt(qy,10) : 7);
    });
  </script>
</body>
</html>
