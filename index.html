<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knox Grammar School · Learning Hub</title>
  <meta name="description" content="Knox Grammar School Learning Hub — Wahroonga, Sydney. Virile Agitur." />
  <script>
    // Decide early whether to play the intro loader (avoids title flash)
    (function () {
      try {
        var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!rm && !sessionStorage.getItem('knoxIntro')) document.documentElement.classList.add('is-loading');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/img/knox-logo.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="bg-aura"></div>
  <div class="bg-grid"></div>

  <!-- Intro loader / reveal -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-panels">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="loader-content">
      <div class="loader-crest"><img src="assets/img/knox-logo.svg" alt="" /></div>
      <div class="loader-count"><span id="loader-num">0</span><b>%</b></div>
      <div class="loader-bar"><i id="loader-fill"></i></div>
      <div class="loader-tag">Virile Agitur</div>
    </div>
  </div>

  <div id="nav-mount" data-active="index.html"></div>

  <!-- Title page (scroll-animated) -->
  <header class="title-hero">
    <div class="title-sticky">
      <div class="container title-inner">
        <div class="crest-plaque" data-px="crest">
          <img src="assets/img/knox-logo.svg" alt="Knox Grammar School crest — Virile Agitur" />
        </div>
        <h1 data-px="title">Knox Grammar School</h1>
        <div class="title-rule" data-px="rule"><span></span>✦<span></span></div>
        <p class="title-motto" data-px="motto">Virile Agitur</p>
        <p class="title-sub" data-px="sub">Learning Hub</p>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span>Scroll</span><i></i></div>
    </div>
  </header>

  <div id="footer-mount"></div>
  <script src="assets/js/main.js"></script>
  <script>
    // Intro loader: count 0->100, then lift the curtain to reveal the title
    (function () {
      const root = document.documentElement;
      const loader = document.getElementById('loader');
      if (!loader) return;
      if (!root.classList.contains('is-loading')) { loader.remove(); document.body.classList.add('revealed'); return; }
      document.body.style.overflow = 'hidden';
      const num = document.getElementById('loader-num');
      const fill = document.getElementById('loader-fill');
      const dur = 1900, start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        const v = Math.round(ease(t) * 100);
        num.textContent = v;
        if (fill) fill.style.transform = 'scaleX(' + (v / 100) + ')';
        if (t < 1) requestAnimationFrame(tick); else finish();
      }
      function finish() {
        setTimeout(() => {
          loader.classList.add('done');
          document.body.classList.add('revealed');
          try { sessionStorage.setItem('knoxIntro', '1'); } catch (e) {}
          setTimeout(() => { loader.remove(); root.classList.remove('is-loading'); document.body.style.overflow = ''; }, 1350);
        }, 280);
      }
      requestAnimationFrame(tick);
    })();

    // Scroll-driven parallax for the title page
    (function () {
      const hero = document.querySelector('.title-hero');
      if (!hero) return;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const el = s => document.querySelector('[data-px="' + s + '"]');
      const crest = el('crest'), title = el('title'), rule = el('rule'), motto = el('motto'), sub = el('sub');
      const cue = document.querySelector('.scroll-cue');
      function frame() {
        const total = hero.offsetHeight - window.innerHeight;
        const p = total > 0 ? Math.min(1, Math.max(0, -hero.getBoundingClientRect().top / total)) : 0;
        if (cue) cue.style.opacity = Math.max(0, 1 - p * 3);
        if (reduce) return;
        if (crest) { crest.style.transform = `translateY(${-p * 130}px) scale(${1 - p * 0.28}) rotate(${-p * 3}deg)`; crest.style.opacity = 1 - p * 0.85; }
        if (title) { title.style.transform = `translateY(${-p * 210}px)`; title.style.opacity = 1 - p * 0.9; title.style.letterSpacing = `${-0.5 + p * 5}px`; }
        if (rule) { rule.style.transform = `translateY(${-p * 250}px)`; rule.style.opacity = 1 - p; }
        if (motto) { motto.style.transform = `translateY(${-p * 290}px)`; motto.style.opacity = 1 - p; }
        if (sub) { sub.style.transform = `translateY(${-p * 330}px)`; sub.style.opacity = 1 - p; }
      }
      let ticking = false;
      function onScroll() { if (!ticking) { requestAnimationFrame(() => { frame(); ticking = false; }); ticking = true; } }
      addEventListener('scroll', onScroll, { passive: true });
      addEventListener('resize', frame);
      frame();
    })();
  </script>
</body>
</html>
