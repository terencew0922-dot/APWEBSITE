<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knox Grammar School · Learning Hub</title>
  <meta name="description" content="Knox Grammar School Learning Hub — Wahroonga, Sydney. Virile Agitur." />
  <script>
    // Decide early whether to play the intro loader (avoids title flash)
    (function () {
      try {
        var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!rm && !sessionStorage.getItem('knoxIntro')) document.documentElement.classList.add('is-loading');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/img/knox-logo.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="bg-aura"></div>
  <div class="bg-grid"></div>

  <!-- Intro loader / reveal -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-panels">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="loader-content">
      <div class="loader-crest"><img src="assets/img/knox-logo.svg" alt="" /></div>
      <div class="loader-count"><span id="loader-num">0</span><b>%</b></div>
      <div class="loader-bar"><i id="loader-fill"></i></div>
      <div class="loader-tag">Virile Agitur</div>
    </div>
  </div>

  <div id="nav-mount" data-active="index.html"></div>

  <!-- Title page (scroll-animated) -->
  <header class="title-hero">
    <div class="title-sticky">
      <div class="hero-stage">
        <h1 class="bigword" data-px="word">KNOX</h1>
        <div class="hero-crest" data-px="crest">
          <img src="assets/img/knox-logo.svg" alt="Knox Grammar School crest — Virile Agitur" />
        </div>
      </div>
      <div class="hero-tagline" data-px="tag">
        <span class="t-motto">Virile Agitur.</span>
        <span class="t-sub">Knox Grammar School — Wahroonga, est. 1924</span>
      </div>
      <div class="hero-scroll" aria-hidden="true">Scroll</div>
    </div>
  </header>

  <!-- Year gate: scroll past the title to choose a year level -->
  <section class="year-gate section">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow"><span class="dot"></span> The Learning Hub</span>
        <h2>Choose your year level</h2>
        <p>Select your year to browse resources, past papers and revision guides by subject.</p>
      </div>
      <div class="year-grid">
        <a class="year-card reveal" href="resources.html?year=7"><span class="yc-num">07</span><span class="yc-label">Year 7</span><span class="yc-go">→</span></a>
        <a class="year-card reveal" href="resources.html?year=8"><span class="yc-num">08</span><span class="yc-label">Year 8</span><span class="yc-go">→</span></a>
        <a class="year-card reveal" href="resources.html?year=9"><span class="yc-num">09</span><span class="yc-label">Year 9</span><span class="yc-go">→</span></a>
        <a class="year-card reveal" href="resources.html?year=10"><span class="yc-num">10</span><span class="yc-label">Year 10</span><span class="yc-go">→</span></a>
        <a class="year-card reveal" href="resources.html?year=11"><span class="yc-num">11</span><span class="yc-label">Year 11</span><span class="yc-go">→</span></a>
        <a class="year-card reveal" href="resources.html?year=12"><span class="yc-num">12</span><span class="yc-label">Year 12</span><span class="yc-go">→</span></a>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>
  <script src="assets/js/main.js"></script>
  <script>
    // Intro loader: count 0->100, then lift the curtain to reveal the title
    (function () {
      const root = document.documentElement;
      const loader = document.getElementById('loader');
      if (!loader) return;
      if (!root.classList.contains('is-loading')) { loader.remove(); document.body.classList.add('revealed'); return; }
      document.body.style.overflow = 'hidden';
      const num = document.getElementById('loader-num');
      const fill = document.getElementById('loader-fill');
      const dur = 1900, start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        const v = Math.round(ease(t) * 100);
        num.textContent = v;
        if (fill) fill.style.transform = 'scaleX(' + (v / 100) + ')';
        if (t < 1) requestAnimationFrame(tick); else finish();
      }
      function finish() {
        setTimeout(() => {
          loader.classList.add('done');
          document.body.classList.add('revealed');
          try { sessionStorage.setItem('knoxIntro', '1'); } catch (e) {}
          setTimeout(() => { loader.remove(); root.classList.remove('is-loading'); document.body.style.overflow = ''; }, 1350);
        }, 280);
      }
      requestAnimationFrame(tick);
    })();

    // Scroll-driven parallax for the title page
    (function () {
      const hero = document.querySelector('.title-hero');
      if (!hero) return;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const el = s => document.querySelector('[data-px="' + s + '"]');
      const word = el('word'), crest = el('crest'), tag = el('tag');
      const cue = document.querySelector('.hero-scroll');
      function frame() {
        const total = hero.offsetHeight - window.innerHeight;
        const p = total > 0 ? Math.min(1, Math.max(0, -hero.getBoundingClientRect().top / total)) : 0;
        if (cue) cue.style.opacity = Math.max(0, 1 - p * 3);
        if (reduce) return;
        if (word) { word.style.transform = `translateY(${-p * 120}px) scale(${1 - p * 0.05})`; word.style.opacity = 1 - p * 0.55; }
        if (crest) { crest.style.transform = `translate(-50%, calc(-50% - ${p * 90}px)) scale(${1 - p * 0.22}) rotate(${-p * 4}deg)`; crest.style.opacity = 1 - p * 0.6; }
        if (tag) { tag.style.transform = `translateY(${-p * 60}px)`; tag.style.opacity = 1 - p * 1.2; }
      }
      let ticking = false;
      function onScroll() { if (!ticking) { requestAnimationFrame(() => { frame(); ticking = false; }); ticking = true; } }
      addEventListener('scroll', onScroll, { passive: true });
      addEventListener('resize', frame);
      frame();
    })();
  </script>
</body>
</html>
